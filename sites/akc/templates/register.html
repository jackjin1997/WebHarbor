{% extends "base.html" %}
{% block title %}Create an Account &ndash; American Kennel Club{% endblock %}
{% block breedbar %}{% endblock %}

{% block content %}
<div class="container section">
  <div class="auth">
    <h1 class="page-title">Create an Account</h1>
    <form method="post" class="stack">
      <div>
        <label for="display_name">Full name</label>
        <input id="display_name" type="text" name="display_name" required>
      </div>
      <div>
        <label for="username">Username</label>
        <input id="username" type="text" name="username" required>
      </div>
      <div>
        <label for="email">Email</label>
        <input id="email" type="email" name="email" autocomplete="username" required>
      </div>
      <div>
        <label for="password">Password</label>
        <input id="password" type="password" name="password" autocomplete="new-password" required>
      </div>
      <div>
        <label for="household">Household</label>
        <select id="household" name="household">
          <option>Apartment</option>
          <option>Condo</option>
          <option>Suburban home</option>
          <option>House with yard</option>
        </select>
      </div>
      <div>
        <label for="activity_level">Activity level</label>
        <select id="activity_level" name="activity_level">
          <option>Low</option>
          <option>Moderate</option>
          <option>High</option>
        </select>
      </div>
      <div>
        <label for="experience">Experience</label>
        <select id="experience" name="experience">
          <option>First-time owner</option>
          <option>Family owner</option>
          <option>Experienced owner</option>
          <option>Sports competitor</option>
        </select>
      </div>
      <button class="btn" type="submit">Create Account</button>
    </form>
  </div>
</div>
{% endblock %}
