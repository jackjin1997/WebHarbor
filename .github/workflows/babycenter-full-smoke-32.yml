name: BabyCenter 32-site full environment smoke

on:
  push:
    branches:
      - codex/ci-pr112-full-smoke-20260916

permissions:
  contents: read

jobs:
  full-environment-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify candidate identity and runner capacity
        run: |
          set -euo pipefail
          mkdir -p /tmp/full-smoke
          workflow_sha=$(git rev-parse HEAD)
          candidate_sha=$(git rev-parse HEAD^)
          test "$candidate_sha" = ea927629862b52e0d16ec6dc801f95583a4a85b1
          test "$(git diff --name-only "$candidate_sha" "$workflow_sha")" = ".github/workflows/babycenter-full-smoke-32.yml"
          printf 'workflow=%s\ncandidate=%s\n' "$workflow_sha" "$candidate_sha" \
            > /tmp/full-smoke/code-sha.txt
          git checkout --detach "$candidate_sha"
          test "$(git rev-parse HEAD)" = ea927629862b52e0d16ec6dc801f95583a4a85b1
          df -h | tee /tmp/full-smoke/disk-before.txt
          docker system df | tee /tmp/full-smoke/docker-disk-before.txt
          available_kib=$(df -Pk . | awk 'NR==2 {print $4}')
          test "$available_kib" -ge 52428800
          cp .assets-revision /tmp/full-smoke/assets-revision.txt

      - name: Fetch current-main assets and BabyCenter candidate
        run: |
          set -euo pipefail
          python -m pip install 'huggingface_hub[cli]' pytest Pillow==11.0.0 -r sites/babycenter/requirements.txt
          repo=$(awk '/^repo:/ {print $2}' .assets-revision)
          base_revision=$(awk '/^revision:/ {print $2}' .assets-revision)
          candidate_revision=2644cf11f09b66156e03961ff7439009631aea6f
          base_cache="sites/.cache/tarballs/$base_revision"
          candidate_cache="sites/.cache/tarballs/$candidate_revision"
          mkdir -p "$base_cache" "$candidate_cache"

          mainline_sites=()
          include_args=()
          for site_dir in sites/*/; do
            site=$(basename "$site_dir")
            [[ "$site" = babycenter ]] && continue
            mainline_sites+=("$site")
            include_args+=(--include "$site.tar.gz")
          done
          test "${#mainline_sites[@]}" = 31
          hf download "$repo" --repo-type dataset --revision "$base_revision" \
            "${include_args[@]}" --local-dir "$base_cache"

          for site in "${mainline_sites[@]}"; do
            tarball="$base_cache/$site.tar.gz"
            if [[ ! -f "$tarball" && -f "sites/$site/.build-generated-seed" ]]; then
              continue
            fi
            test -f "$tarball"
            python3 scripts/validate_asset_archive.py "$tarball" "$site"
            python3 scripts/extract_asset_archive.py "$tarball" sites "$site"
            python3 scripts/sync_assets_to_inventory.py "sites/$site"
            migrator="sites/$site/migrate_seed.py"
            database="sites/$site/instance_seed/$site.db"
            if [[ -f "sites/$site/.build-generated-seed" ]]; then
              rm -rf "sites/$site/instance_seed"
            elif [[ -f "$migrator" && -f "$database" ]]; then
              PYTHONHASHSEED=0 python3 "$migrator" "$database"
            fi
          done

          hf download "$repo" --repo-type dataset --revision "$candidate_revision" \
            --include 'babycenter.tar.gz' --local-dir "$candidate_cache"
          babycenter_archive="$candidate_cache/babycenter.tar.gz"
          python3 scripts/validate_asset_archive.py "$babycenter_archive" babycenter
          python3 scripts/extract_asset_archive.py "$babycenter_archive" sites babycenter
          python3 scripts/sync_assets_to_inventory.py sites/babycenter

          test "$(sha256sum "$babycenter_archive" | awk '{print $1}')" = \
            5eaeb91f3476b4a4667942b5b78302112c096c9d242fccc049d13e71dceec166
          ./scripts/check_assets.sh
          sha256sum "$babycenter_archive" \
            sites/babycenter/instance_seed/babycenter.db \
            sites/babycenter/tasks.jsonl \
            > /tmp/full-smoke/candidate-sha256.txt
          python -m pytest -q sites/babycenter/tests sites/babycenter/verify/tests \
            2>&1 | tee /tmp/full-smoke/babycenter-tests.txt
          sha256sum "$base_cache"/*.tar.gz > /tmp/full-smoke/mainline-asset-sha256.txt
          ./scripts/build.sh webharbor:pr112-full-smoke-32
          docker image inspect webharbor:pr112-full-smoke-32 > /tmp/full-smoke/image-inspect.json

      - name: Run HTTP, health, target reset, and reset-all gates
        run: |
          set -euo pipefail
          docker run -d --name wh-pr112-full-smoke-32 \
            -p 8201:8101 -p 41000-41031:40000-40031 \
            webharbor:pr112-full-smoke-32

          ready=0
          for attempt in $(seq 1 90); do
            if curl -fsS http://localhost:8201/health > /tmp/full-smoke/health-before.json; then
              ready=1
              break
            fi
            sleep 2
          done
          test "$ready" = 1
          jq -e '.ok == true and (.sites | length == 32) and ([.sites[].alive] | all)' \
            /tmp/full-smoke/health-before.json

          : > /tmp/full-smoke/http-before.txt
          for port in $(seq 41000 41031); do
            code=$(curl -sS -o /dev/null -w '%{http_code}' "http://localhost:${port}/")
            printf '%s\n' "${port}:${code}" | tee -a /tmp/full-smoke/http-before.txt
            test "$code" = 200
          done

          docker cp wh-pr112-full-smoke-32:/opt/WebSyn/babycenter/instance_seed/babycenter.db /tmp/babycenter-image-seed.db
          python - <<'PYCODE' | tee /tmp/full-smoke/babycenter-seed-parity.txt
          import sqlite3
          from werkzeug.security import check_password_hash
          def data(path):
              con = sqlite3.connect(f"file:{path}?mode=ro", uri=True)
              tables = [r[0] for r in con.execute("SELECT name FROM sqlite_master WHERE type='table' ORDER BY name")]
              result = {}
              for table in tables:
                  columns = [r[1] for r in con.execute(f'PRAGMA table_info("{table}")')]
                  rows = [list(r) for r in con.execute(f'SELECT * FROM "{table}" ORDER BY 1')]
                  if table == 'user':
                      pos = columns.index('password_hash')
                      for row in rows:
                          assert check_password_hash(row[pos], 'TestPass123!')
                          row[pos] = '<validated benchmark password>'
                  result[table] = (columns, rows)
              con.close()
              return result
          archive = data('sites/babycenter/instance_seed/babycenter.db')
          image = data('/tmp/babycenter-image-seed.db')
          assert archive == image, 'Image seed differs from frozen asset seed in schema/business data'
          print('PASS: all table schemas and rows match the frozen HF seed; salted password hashes independently validate the same benchmark password.')
          print({table: len(value[1]) for table, value in image.items()})
          PYCODE

          seed_sha=$(docker exec wh-pr112-full-smoke-32 sha256sum \
            /opt/WebSyn/babycenter/instance_seed/babycenter.db | awk '{print $1}')
          docker exec wh-pr112-full-smoke-32 sh -c \
            'printf reset-probe >> /opt/WebSyn/babycenter/instance/babycenter.db'
          dirty_sha=$(docker exec wh-pr112-full-smoke-32 sha256sum \
            /opt/WebSyn/babycenter/instance/babycenter.db | awk '{print $1}')
          test "$dirty_sha" != "$seed_sha"
          curl -fsS -X POST http://localhost:8201/reset/babycenter \
            > /tmp/full-smoke/reset-babycenter.json
          reset_sha=$(docker exec wh-pr112-full-smoke-32 sha256sum \
            /opt/WebSyn/babycenter/instance/babycenter.db | awk '{print $1}')
          test "$reset_sha" = "$seed_sha"
          printf 'seed=%s\ndirty=%s\nreset=%s\n' \
            "$seed_sha" "$dirty_sha" "$reset_sha" \
            > /tmp/full-smoke/babycenter-reset-sha256.txt

          start=$(date +%s)
          curl -fsS -X POST http://localhost:8201/reset-all \
            > /tmp/full-smoke/reset-all.json
          elapsed=$(($(date +%s) - start))
          printf '%s\n' "$elapsed" > /tmp/full-smoke/reset-all-seconds.txt
          test "$elapsed" -lt 10
          jq -e '.ok == true and (.sites | length == 32) and ([.sites[].ready] | all)' \
            /tmp/full-smoke/reset-all.json

          post_reset_all_sha=$(docker exec wh-pr112-full-smoke-32 sha256sum \
            /opt/WebSyn/babycenter/instance/babycenter.db | awk '{print $1}')
          test "$post_reset_all_sha" = "$seed_sha"
          printf '%s\n' "$post_reset_all_sha" \
            > /tmp/full-smoke/babycenter-post-reset-all-sha256.txt

          curl -fsS http://localhost:8201/health > /tmp/full-smoke/health-after.json
          jq -e '.ok == true and (.sites | length == 32) and ([.sites[].alive] | all)' \
            /tmp/full-smoke/health-after.json
          : > /tmp/full-smoke/http-after.txt
          for port in $(seq 41000 41031); do
            code=$(curl -sS -o /dev/null -w '%{http_code}' "http://localhost:${port}/")
            printf '%s\n' "${port}:${code}" | tee -a /tmp/full-smoke/http-after.txt
            test "$code" = 200
          done

      - name: Collect diagnostics
        if: always()
        run: |
          mkdir -p /tmp/full-smoke
          docker logs wh-pr112-full-smoke-32 > /tmp/full-smoke/container.log 2>&1 || true
          docker inspect wh-pr112-full-smoke-32 > /tmp/full-smoke/container-inspect.json 2>&1 || true
          df -h > /tmp/full-smoke/disk-after.txt
          docker system df > /tmp/full-smoke/docker-disk-after.txt

      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: babycenter-32-site-full-smoke
          path: /tmp/full-smoke
          retention-days: 30
